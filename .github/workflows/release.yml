name: Release

on:
  push:
    tags: [ 'v*' ]
    branches: [ 'release/v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME#release/}"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          [[ "$RELEASE_TAG" == v* ]]
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require stable signing secrets
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEY_STORE"
          test -n "$KEY_STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Checkout pinned LSPatch
        run: |
          git clone https://github.com/JingMatrix/LSPatch.git work/LSPatch
          git -C work/LSPatch checkout 0dc50f42503711b14f5e2bb217c2bdd6321ce5be
          git -C work/LSPatch submodule update --init core
          git -C work/LSPatch/core submodule update --init --recursive \
            external/apache/commons-lang \
            external/axml/manifest-editor \
            external/dobby \
            external/fmt \
            external/lsplant \
            external/lsplt \
            external/xz-embedded
          python3 scripts/apply_overlay.py work/LSPatch

      - name: Use official libxposed 102 Maven artifacts
        run: python3 scripts/patch_vector_libxposed.py work/LSPatch

      - name: Prepare pinned DLsiteFloat source + playback-control overlay
        run: |
          bash scripts/prepare_dlsitesfloat.sh work/DLsiteFloat-src
          python3 scripts/verify_no_dlsitesound_apk.py .

      - name: Setup Java 17 for DLsiteFloat
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - uses: seanmiddleditch/gha-setup-ninja@v6
        with:
          version: 1.12.0

      - name: Build custom DLsiteFloat module
        run: bash scripts/build_dlsitesfloat.sh work/DLsiteFloat-src work/LSPatch/manager/src/main/assets/quickpatch

      - name: Switch to Java 21 for LSPatch
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure signing and build
        working-directory: work/LSPatch
        env:
          KEY_STORE: ${{ secrets.KEY_STORE }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          rm -rf "$ANDROID_HOME/cmake"
          echo "$KEY_STORE" | base64 --decode > quickpatch-release.jks
          {
            echo "androidStorePassword=$KEY_STORE_PASSWORD"
            echo "androidKeyAlias=$KEY_ALIAS"
            echo "androidKeyPassword=$KEY_PASSWORD"
            echo "androidStoreFile=quickpatch-release.jks"
            echo 'org.gradle.parallel=true'
            echo 'org.gradle.jvmargs=-Xmx2048m'
          } >> gradle.properties
          ./gradlew :manager:buildRelease

      - name: Package release
        run: |
          mkdir -p dist
          APK=$(find work/LSPatch/manager/build/outputs/apk/release work/LSPatch/out/release -name '*.apk' -type f 2>/dev/null | head -n 1)
          test -n "$APK"
          cp "$APK" dist/DLsiteSound-Rootless-Patcher-${{ env.RELEASE_TAG }}.apk
          rm -rf work/LSPatch/.git work/DLsiteFloat-src/.git
          cp README.md THIRD_PARTY.md LICENSE work/LSPatch/
          mkdir -p work/Rootless-Patcher-src
          cp -a .github overlay dlsitefloat-overlay scripts README.md THIRD_PARTY.md LICENSE CHANGELOG.md PROJECT_STATUS.md .gitignore work/Rootless-Patcher-src/
          tar -C work \
            --exclude='*/build' --exclude='*/build/*' \
            --exclude='*/.gradle' --exclude='*/.gradle/*' \
            --exclude='*/.kotlin' --exclude='*/.kotlin/*' \
            --exclude='LSPatch/out' --exclude='LSPatch/out/*' \
            --exclude='*/.git' --exclude='*/.git/*' \
            -czf dist/DLsiteSound-Rootless-Patcher-${{ env.RELEASE_TAG }}-combined-source.tar.gz \
            LSPatch DLsiteFloat-src Rootless-Patcher-src
          (
            cd dist
            sha256sum \
              DLsiteSound-Rootless-Patcher-${{ env.RELEASE_TAG }}.apk \
              DLsiteSound-Rootless-Patcher-${{ env.RELEASE_TAG }}-combined-source.tar.gz \
              > SHA256SUMS.txt
          )

      - name: Verify release APK
        run: python3 scripts/verify_built_apk.py dist/DLsiteSound-Rootless-Patcher-${{ env.RELEASE_TAG }}.apk release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" dist/* \
            --target "${{ github.sha }}" \
            --title "DLsiteSound Rootless Patcher ${{ env.RELEASE_TAG }}" \
            --generate-notes
